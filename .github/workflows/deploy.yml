name: Build for Hostinger

# Every push to main: build Next.js (static export) + copy PHP API
# and publish the ready-to-serve site to the `deploy` branch.
# Hostinger (hPanel -> Advanced -> GIT) pulls the `deploy` branch into public_html via webhook.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend (static export)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble public_html
        run: |
          mkdir -p site/api
          cp -r frontend/out/. site/
          cp -r backend/. site/api/
          # config.php lives only on the server (DB password); never ship it from the repo
          rm -f site/api/config.php site/api/config.sample.php site/api/Dockerfile site/api/router.php
          # keep server-only files out of git so pulls never touch them
          printf "api/config.php\napi/uploads/\n" > site/.gitignore
          # marker to check which build is live: https://vishwaship.com/build.txt
          echo "${GITHUB_SHA} $(date -u +%FT%TZ)" > site/build.txt

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./site
          keep_files: false
          enable_jekyll: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: deploy ${{ github.sha }}

      # Direct upload to Hostinger over FTP (runs only once the FTP_* secrets are added in
      # GitHub → Settings → Secrets and variables → Actions). Only changed files are sent;
      # nothing is deleted on the server and api/config.php is never touched.
      - name: Upload to Hostinger (FTP)
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || '../domains/vishwaship.com/public_html' }}  # FTP login opens in ~/public_html; live site lives in ~/domains/vishwaship.com/public_html
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          # tidy values pasted with spaces / ftp:// prefix / trailing slash
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^(s?ftps?|https?)://##; s#/.*$##')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')
          echo "server length ${#FTP_SERVER}, has colon: $([[ $FTP_SERVER == *:* ]] && echo yes || echo no)"
          lftp -e "
            set ftp:ssl-allow yes; set ftp:ssl-force no; set ssl:verify-certificate no;
            set ftp:passive-mode yes; set ftp:prefer-epsv no;
            set net:max-retries 4; set net:reconnect-interval-base 5; set net:timeout 30;
            open --env-password -u $FTP_USERNAME $FTP_SERVER;
            mirror -R --parallel=4 --only-newer --no-perms --verbose=1 \
              --exclude-glob api/config.php --exclude-glob .gitignore --exclude-glob .nojekyll \
              ./site/ $FTP_DIR;
            echo '--- FTP home:'; pwd; cls -l index.html build.txt;
            bye"
          echo "Uploaded to $FTP_DIR"
